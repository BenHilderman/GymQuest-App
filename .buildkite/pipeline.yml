# ─────────────────────────────────────────────────────────────────────
# Buildkite Pipeline for GymQuest iOS
# ─────────────────────────────────────────────────────────────────────
# Runs on self-hosted or Buildkite-hosted macOS agents.
# Steps execute sequentially with `wait` barriers between phases.
#
# Agent requirements: macOS with Xcode 15+, Homebrew, xcodegen
# ─────────────────────────────────────────────────────────────────────

env:
  XCODE_VERSION: "15.4"
  SIMULATOR_DEVICE: "iPhone 16"
  WORKING_DIR: "GymQuest-iOS"

steps:
  # ── Phase 1: Project Generation ──────────────────────────────────

  - label: ":hammer: Generate Xcode Project"
    command: |
      cd $WORKING_DIR
      which xcodegen || brew install xcodegen
      xcodegen generate
      xcodebuild -resolvePackageDependencies \
        -scheme GymQuest \
        -clonedSourcePackagesDirPath .spm-cache
    agents:
      os: "macos"
      queue: "default"
    timeout_in_minutes: 15

  - wait

  # ── Phase 2: Unit + Integration Tests ────────────────────────────

  - label: ":test_tube: Unit Tests (iPhone 16)"
    command: |
      cd $WORKING_DIR
      xcodebuild test \
        -scheme GymQuestTests \
        -destination "platform=iOS Simulator,name=iPhone 16" \
        -clonedSourcePackagesDirPath .spm-cache \
        -enableCodeCoverage YES \
        -resultBundlePath TestResults-iPhone16.xcresult \
        GCC_TREAT_WARNINGS_AS_ERRORS=YES \
        | xcpretty --color
    agents:
      os: "macos"
      queue: "default"
    artifact_paths:
      - "GymQuest-iOS/TestResults-iPhone16.xcresult/**/*"
    timeout_in_minutes: 30

  - label: ":test_tube: Unit Tests (iPhone SE)"
    command: |
      cd $WORKING_DIR
      xcodebuild test \
        -scheme GymQuestTests \
        -destination "platform=iOS Simulator,name=iPhone SE (3rd generation)" \
        -clonedSourcePackagesDirPath .spm-cache \
        -enableCodeCoverage YES \
        -resultBundlePath TestResults-iPhoneSE.xcresult \
        GCC_TREAT_WARNINGS_AS_ERRORS=YES \
        | xcpretty --color
    agents:
      os: "macos"
      queue: "default"
    artifact_paths:
      - "GymQuest-iOS/TestResults-iPhoneSE.xcresult/**/*"
    timeout_in_minutes: 30

  - wait

  # ── Phase 3: UI Smoke Tests ──────────────────────────────────────

  - label: ":iphone: UI Smoke Tests"
    command: |
      cd $WORKING_DIR
      xcodebuild test \
        -scheme GymQuestUITests \
        -destination "platform=iOS Simulator,name=$SIMULATOR_DEVICE" \
        -clonedSourcePackagesDirPath .spm-cache \
        -resultBundlePath UITestResults.xcresult \
        | xcpretty --color
    agents:
      os: "macos"
      queue: "default"
    artifact_paths:
      - "GymQuest-iOS/UITestResults.xcresult/**/*"
    timeout_in_minutes: 20

  - wait

  # ── Phase 4: Performance (main branch or manual) ─────────────────

  - label: ":rocket: Performance Baselines"
    command: |
      cd $WORKING_DIR
      xcodebuild test \
        -scheme GymQuestPerformanceTests \
        -destination "platform=iOS Simulator,name=$SIMULATOR_DEVICE" \
        -clonedSourcePackagesDirPath .spm-cache \
        -resultBundlePath PerformanceResults.xcresult \
        | xcpretty --color
    agents:
      os: "macos"
      queue: "default"
    artifact_paths:
      - "GymQuest-iOS/PerformanceResults.xcresult/**/*"
    timeout_in_minutes: 30
    if: "build.branch == 'main' || build.env('BUILDKITE_TRIGGERED_FROM_BUILD_ID') != null"

  # ── Phase 5: Coverage Report ─────────────────────────────────────

  - label: ":bar_chart: Coverage Report"
    command: |
      cd $WORKING_DIR
      if [ -d "TestResults-iPhone16.xcresult" ]; then
        xcrun xccov view --report TestResults-iPhone16.xcresult --json | \
          python3 -c "
      import json, sys
      data = json.load(sys.stdin)
      for t in data.get('targets', []):
          if 'GymQuest' in t.get('name','') and 'Tests' not in t.get('name',''):
              pct = t.get('lineCoverage', 0) * 100
              print(f'Coverage: {pct:.1f}%')
              break
      " || echo "Coverage extraction skipped"
      fi
    agents:
      os: "macos"
      queue: "default"
    soft_fail: true
