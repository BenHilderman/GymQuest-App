name: GymQuest
options:
  bundleIdPrefix: com.gymquest
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    INFOPLIST_KEY_CFBundleDisplayName: GymQuest
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.healthcare-fitness"

targets:
  GymQuest:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: GymQuest
        excludes:
          - "Services/HapticManager.swift"
    dependencies:
      - package: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymquest.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: 356D828QY6
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: GymQuest/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.672887012957-98c4v99phuk4730fdnr6qvpfebmua6lo
        GIDClientID: 672887012957-98c4v99phuk4730fdnr6qvpfebmua6lo.apps.googleusercontent.com
        NSHealthShareUsageDescription: "GymQuest uses your health data to track workouts, activity, and fitness progress."
        NSHealthUpdateUsageDescription: "GymQuest saves your workout data to Apple Health."

  GymQuestWatch:
    type: application
    platform: watchOS
    sources:
      - path: GymQuestWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymquest.app.watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.gymquest.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 356D828QY6
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
    entitlements:
      path: GymQuestWatch/GymQuestWatch.entitlements

  GymQuestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
      - path: Tests/Integration
      - path: Tests/Snapshot
      - path: Tests/Helpers
      - path: Tests/Fixtures
    dependencies:
      - target: GymQuest_iOS
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymquest.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GymQuest.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GymQuest"
        BUNDLE_LOADER: "$(TEST_HOST)"
        DEVELOPMENT_TEAM: 356D828QY6
        CODE_SIGN_STYLE: Automatic
        GCC_TREAT_WARNINGS_AS_ERRORS: YES

  GymQuestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: GymQuest_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymquest.uitests
        TEST_TARGET_NAME: GymQuest
        DEVELOPMENT_TEAM: 356D828QY6
        CODE_SIGN_STYLE: Automatic

  GymQuestPerformanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Performance
    dependencies:
      - target: GymQuest_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymquest.performancetests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GymQuest.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GymQuest"
        BUNDLE_LOADER: "$(TEST_HOST)"
        DEVELOPMENT_TEAM: 356D828QY6
        CODE_SIGN_STYLE: Automatic
