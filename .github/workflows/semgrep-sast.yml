# ─────────────────────────────────────────────────────────────────────
# Semgrep SAST (Static Application Security Testing)
# ─────────────────────────────────────────────────────────────────────
# Scans Swift source for security vulnerabilities, hardcoded secrets,
# insecure patterns, and OWASP Top 10 issues.
#
# Semgrep is language-agnostic and runs on ubuntu (no macOS needed).
# Results are uploaded to GitHub Security tab in SARIF format.
# ─────────────────────────────────────────────────────────────────────

name: Semgrep SAST

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday 2 AM UTC

concurrency:
  group: semgrep-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      security-events: write
      contents: read

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Semgrep Scan
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/ci \
            --sarif \
            --output semgrep-results.sarif \
            GymQuest-iOS/GymQuest/ \
            || true

      - name: Run Semgrep iOS-Specific Rules
        run: |
          semgrep scan \
            --config p/swift \
            --json \
            --output semgrep-swift.json \
            GymQuest-iOS/GymQuest/ \
            || true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Upload Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: |
            semgrep-results.sarif
            semgrep-swift.json
          retention-days: 30
